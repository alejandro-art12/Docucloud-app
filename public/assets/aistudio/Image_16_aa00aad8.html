<!-- Subtle decorative ambient highlight -->
<div class="relative w-full flex flex-col items-center pt-space-lg mb-space-lg">
<!-- Brand Visual & Identity -->
<div class="relative mb-space-md flex items-center justify-center">
<div class="absolute -inset-2 bg-surface-container-high rounded-full blur-xl opacity-70"></div>
<div class="relative w-24 h-24 rounded-2xl bg-surface-container-lowest shadow-md flex items-center justify-center p-space-xs transition-transform duration-300 hover:scale-105">
<img alt="Docucloud Logo" class="w-full h-full object-contain rounded-xl" src="https://lh3.googleusercontent.com/aida/AEtjO1WsQfJAgfCAMGDhkmAo4uVtc3TjDu_MXAK60vJb0GTL_ezag2ibgdXkQ806CbLb0Y9zX5P5pCEQteRomIOmOgDDwszvWWSk-7_3BYvlk6SorjNZFKRR1Dkx93jMyoVMT4OyP_ic0rI6YMz5NnEb2xu1F753I2qFAh9YVNGd8m0_28_DW08-rbxx4VgOz_OTX89YaN0IjAUOpotOCr5Aoa-JvxkIK8NhoEhMv5lHlbYm5sGlY7-sMT4mCMA"/>
</div>
</div>
<!-- App Name & Welcome Copy -->
<div class="text-center space-y-1 max-w-xs">
<div class="inline-flex items-center gap-1.5 px-space-sm py-0.5 rounded-full bg-surface-container text-primary mb-1">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">shield</span>
<span class="font-label-sm text-label-sm tracking-wide uppercase">Bóveda Corporativa</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Docucloud</h1>
<h2 class="font-headline-md text-headline-md text-on-surface font-semibold">Bienvenido de nuevo</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Accede a tus documentos de forma segura</p>
</div>
</div>
<!-- Form Container -->
<div class="w-full bg-surface-container-lowest rounded-2xl p-space-lg shadow-sm space-y-space-lg">
<form class="space-y-space-md" id="loginForm" onsubmit="event.preventDefault(); handleLoginSubmit();">
<!-- Correo Electrónico Field -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface" for="email">
          Correo electrónico
        </label>
<div class="relative flex items-center">
<div class="absolute left-3.5 flex items-center pointer-events-none text-tertiary">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl transition-all duration-200 outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#2563eb]" id="email" name="email" placeholder="tu.correo@ejemplo.com" required="" type="email"/>
</div>
</div>
<!-- Contraseña Field with Visibility Toggle -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface" for="password">
          Contraseña
        </label>
<div class="relative flex items-center">
<div class="absolute left-3.5 flex items-center pointer-events-none text-tertiary">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full h-12 pl-11 pr-12 bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl transition-all duration-200 outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#2563eb]" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Alternar visibilidad de contraseña" class="absolute right-1 w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-transform rounded-lg" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Checkbox & Forgot Password -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2.5 cursor-pointer select-none group">
<div class="relative flex items-center justify-center">
<input class="peer sr-only" id="rememberMe" name="remember" type="checkbox"/>
<div class="w-5 h-5 rounded-md bg-surface-container-high peer-checked:bg-primary-container transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">
            Recordarme
          </span>
</label>
<a class="font-label-md text-label-md text-primary font-medium hover:underline active:opacity-75 transition-opacity" href="#">
          ¿Olvidaste tu contraseña?
        </a>
</div>
<!-- Action Button -->
<div class="pt-2">
<button class="w-full h-12 bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg rounded-xl shadow-md active:scale-[0.99] transition-all flex items-center justify-center gap-2 group" id="submitBtn" type="submit">
<span>Iniciar sesión</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-0.5">lock_open</span>
</button>
</div>
</form>
</div>
<!-- Sign up prompt -->
<div class="mt-space-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
      ¿No tienes una cuenta? 
      <a class="font-label-lg text-label-lg text-primary hover:underline font-semibold ml-1 inline-flex items-center gap-0.5" href="#">
        Crear cuenta
        <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</a>
</p>
</div>
<!-- Security End-to-End Badge -->
<div class="mt-space-xl flex items-center justify-center gap-2 text-tertiary">
<span class="material-symbols-outlined text-[18px] text-primary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase">Cifrado de extremo a extremo</span>
</div>
</div>
<script>
  (function initDocucloudLogin() {
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const submitBtn = document.getElementById('submitBtn');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        
        // Haptic feedback illusion
        toggleBtn.classList.add('scale-110');
        setTimeout(() => toggleBtn.classList.remove('scale-110'), 150);
      });
    }

    window.handleLoginSubmit = function() {
      if (!submitBtn) return;
      const originalHtml = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-90');
      submitBtn.innerHTML = `
        <span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span>
        <span>Autenticando...</span>
      `;

      setTimeout(() => {
        submitBtn.innerHTML = `
          <span class="material-symbols-outlined text-[20px]">check_circle</span>
          <span>Acceso verificado</span>
        `;
        submitBtn.classList.remove('bg-primary-container');
        submitBtn.classList.add('bg-secondary');

        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-90', 'bg-secondary');
          submitBtn.classList.add('bg-primary-container');
          submitBtn.innerHTML = originalHtml;
        }, 1600);
      }, 1200);
    };
  })();
</script></main></body></html>
